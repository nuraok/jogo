<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de compilador "trabalho ifsp"</title>
    <link rel="stylesheet" href="dist/output.css">
</head>

<body class="flex justify-center items-center w-screen h-screen bg-black font-pixel text-white text-2xl">
    <main id="tela" class="relative bg-black h-200 w-300 overflow-hidden aspect-square">
        <template> </template>

        <div class="absolute bg-red-500 z-21 opacity-50" id="hitboxPlayer"></div>
        <div class="absolute bg-red-500 z-21 opacity-50" id="hitboxFlower"></div>

        <div
            class="absolute bg-cover h-[calc(367px*(4))] w-[calc(385px*(4))] z-19 bottom-10 [image-rendering:pixelated]">
        </div>

        <div class="absolute [image-rendering:pixelated] z-20" id="mrFlowery"></div>

        <div class="absolute [image-rendering:pixelated] z-20" id="player"></div>

        <div class="absolute bg-cover h-[calc(367px*(4))] w-[calc(385px*(4))] z-0 bottom-10 [image-rendering:pixelated]"
            id="background"></div>

        <div class="flex flex-row gap-4 absolute z-30 bg-black h-fit w-240 border-white border-5 p-4"
            id="dialog" style="left: 50%; bottom: 20px; transform: translateX(-50%);">
            <div class="w-[192px] h-[192px]">
                <div id="dialogSprite" class="[image-rendering:pixelated] mx-auto">
                </div>
            </div>
            <div class="relative" style="flex: 1 1 0%;">
                <p class="font-geist top-4 leading-none text-white text-[50px] absolute">*</p>
                <h1 id="dialogText" class="absolute top-4 left-8"
                    style="right: 1rem; white-space: pre-line; line-height: 1.3;"></h1>
            </div>

        </div>
        <div class="flex flex-col gap-2 absolute z-30 bg-black h-40 w-240 border-white border-5 p-4"
            id="choose" style="left: 50%; bottom: 20px; transform: translateX(-50%);">
                <p class="place-self-center" id="">
                    askText
                </p>
                <div class="flex flex-row justify-around">

                    <div class="flex flex-row gap-2">
                        <div></div>
                        <h2 id="" class="">choose1</h2>
                    </div>
            
                </div>
        </div>
    </main>
    <script type="module" src="codex.js"></script>
</body>

</html>
